name: Build Mobile Apps (Android APK & iOS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript Dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: equisplit-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install JavaScript Dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: Install CocoaPods
        run: |
          cd ios
          bundle exec pod install

      - name: Build iOS Application (Release)
        run: |
          xcodebuild -workspace ios/equisplit.xcworkspace \
            -scheme equisplit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/derivedData/Build/Products/Release-iphoneos/equisplit.app build/Payload/
          cd build
          zip -r equisplit.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: equisplit-ios-ipa
          path: build/equisplit.ipa
          if-no-files-found: error
          retention-days: 14